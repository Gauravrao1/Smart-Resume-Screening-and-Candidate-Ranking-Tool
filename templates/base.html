<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple tool for comparing resumes against a job description.">
  <title>{% block title %}SmartScreen — Resume screening{% endblock %}</title>
  <!-- Preconnect for font performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='18' width='100' height='100' fill='%236366f1'/><text x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' font-size='55' font-weight='800' fill='white'>S</text></svg>">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">S</span><span>Smart</span>Screen</a>
      <span class="tag">Resume screening workspace</span>
      {% if user %}
      <nav class="top-nav" aria-label="Primary navigation">
        <a href="{{ url_for('index') }}">New screening</a>
      </nav>
      <div class="account-menu">
        <span>{{ user['name'] }}</span>
        <form method="post" action="{{ url_for('logout') }}"><button type="submit">Sign out</button></form>
      </div>
      {% else %}
      <a class="header-login" href="{{ url_for('login') }}">Sign in</a>
      <a class="btn header-cta" href="{{ url_for('register') }}">Create account</a>
      {% endif %}
    </div>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="foot">Your files are processed in memory and never stored. Review results before making a decision.</footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
