<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Resume Screener{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">S</span><span>Smart</span>Screen</a>
      <span class="tag">Resume screening &amp; candidate ranking</span>
      <nav class="top-nav" aria-label="Primary navigation"><a href="{{ url_for('index') }}">Workspace</a><a href="#how-it-works">How it works</a></nav>
      <span class="secure-note"><span class="status-dot"></span>Private by design</span>
    </div>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="foot">Resumes are processed in memory and never stored. Scores are decision support - always review candidates yourself.</footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
